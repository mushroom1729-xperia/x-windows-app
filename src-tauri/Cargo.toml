[package]
name = "x-windows-app"
version = "0.4.2"
description = "X (Twitter) client for Windows with Control Panel for Twitter, ad hiding and media downloads"
authors = ["mushroom1729-xperia"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rfd = "0.15"

[profile.release]
strip = true
lto = true
codegen-units = 1
