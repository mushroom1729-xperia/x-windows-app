name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build X variant with Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "X for Windows v__VERSION__"
          releaseBody: |
            ## 変更点
            - 共有・コピーURL のドメイン置換が効かない場合があったのを修正（コピー方式の違いに対応）
            - 左サイドバーの項目ごとに表示 / 非表示を選べる設定を追加
            - 左上の鳥ロゴを少し大きくし、ホームのアイコンには影響しないよう修正
            - ホームのアイコンを旧 Twitter のアイコンに変更する設定を追加
          releaseDraft: true
          prerelease: false

      - name: Upload X portable exe to the release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          Copy-Item "src-tauri/target/release/x-windows-app.exe" "X-portable-$version.exe"
          gh release upload "v$version" "X-portable-$version.exe" --clobber

      - name: Build Twitter variant with Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "X for Windows v__VERSION__"
          releaseDraft: true
          prerelease: false
          args: --config src-tauri/tauri.twitter.json

      - name: Upload Twitter portable exe to the release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          Copy-Item "src-tauri/target/release/x-windows-app.exe" "Twitter-portable-$version.exe"
          gh release upload "v$version" "Twitter-portable-$version.exe" --clobber
