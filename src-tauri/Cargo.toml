[package]
name = "x-windows-app"
version = "0.1.0"
description = "X (Twitter) client for Windows with Control Panel for Twitter, ad hiding and media downloads"
authors = ["mushroom1729-xperia"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
